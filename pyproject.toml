[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikoshi"
version = "0.1.0"
description = "Multi-agent collaboration through shared files, pages, and persistent conversations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "markdown-it-py>=4,<5",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
mikoshi = "mikoshi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mikoshi", "mikoshi.*"]
namespaces = false

[tool.setuptools.package-data]
"mikoshi.isolation" = ["Dockerfile"]
"mikoshi.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["output", "examples", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
