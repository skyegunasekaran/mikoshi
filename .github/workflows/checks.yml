name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked contributor environment
        run: uv sync --locked --extra dev
      - name: Lint, documentation, and mocked infrastructure tests
        run: uv run --locked python tests/support/development.py check
      - name: Build and verify installed release artifacts
        run: uv run --locked python tests/support/development.py build
